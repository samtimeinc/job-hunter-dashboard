# Scans all job sources on a schedule by running the scan directly inside the
# Actions runner, then writing to Neon.
#
# Why this exists (and why NOT /api/cron):
#   Vercel's free (Hobby) tier caps Node serverless functions at ~60s
#   (`maxDuration: 120` in vercel.json is silently clamped) and the gateway
#   hard-cuts the connection around there. `runScan()` synchronously inside
#   `api/cron.ts` was fitting under that limit *on average*, but a Neon
#   cold-start + one slow aggregator fetch pushes it over intermittently →
#   bare `curl: (22) ... 504` with no response body (the JS try/catch never
#   runs because the function is killed mid-flight).
#   GitHub Actions runs on a full Ubuntu VM with no gateway timeout, and
#   `runScan()` already writes straight to Neon over HTTP (the same path the
#   local `npm run scan` uses). So we just run it here.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL  — Neon connection string (same value as Vercel's env var).
#   ADZUNA_APP_ID, ADZUNA_API_KEY — Adzuna API credentials.
#   RAPIDAPI_KEY               — Active Jobs DB (and any other RapidAPI provider).
#   THEMUSE_API_KEY            — The Muse API key.
#   USAJOBS_API_KEY            — USAJOBS API key.
#   (SCRAPERS THAT LACK A KEY SKIP CLEANLY — only DATABASE_URL is required.)
#
# To trigger a scan immediately without waiting for the schedule, run the
# workflow manually from the Actions tab (the "Run workflow" button).

name: Scheduled job scan

on:
  schedule:
    # Runs at 20:00 UTC every day.
    # Note: scheduled workflows run on the latest commit on the default branch
    # and may drift by a few minutes during periods of high GitHub load.
    - cron: '0 20 * * *'
  workflow_dispatch: {} # enables the manual "Run workflow" button

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Skip Playwright Chromium download
        # The runner doesn't need the browser binary — runScan() skips the
        # Playwright adapters when SKIP_PLAYWRIGHT=1 (same gate Vercel uses),
        # and those companies still get badge-matched against the aggregators.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=$PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD"

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_PLAYWRIGHT: '1'
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
        run: npm run scan
